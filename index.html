<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 18 Etapas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    .etapa { display: none !important; }
    .etapa.active { display: block !important; }
  </style>
</head>
<body>
  <div id="quizContainer"></div>
  
  <script>
    let etapaAtual = 1;
    const totalEtapas = 18;
    const container = document.getElementById('quizContainer');
    
    async function carregarEtapa(numero) {
      try {
        const response = await fetch(`./pages/etapa-${numero}.json`);
        
        if (!response.ok) {
          throw new Error('Arquivo não encontrado');
        }
        
        const data = await response.json();
        container.innerHTML = data.conteudo;
        
        // Re-adicionar listeners após carregar
        const clickListener = function(e) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          proximaEtapa();
          return false;
        };
        
        const submitListener = function(e) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          proximaEtapa();
          return false;
        };
        
        document.addEventListener('click', clickListener, true);
        document.addEventListener('submit', submitListener, true);
        
        window.scrollTo(0, 0);
      } catch (err) {
        console.error('Erro ao carregar etapa:', err);
        container.innerHTML = `<div style="padding: 20px; text-align: center;"><h2>Erro ao carregar etapa ${numero}</h2><p>${err.message}</p></div>`;
      }
    }
    
    function proximaEtapa() {
      if (etapaAtual < totalEtapas) {
        etapaAtual++;
        carregarEtapa(etapaAtual);
      }
    }
    
    // Inicializar
    carregarEtapa(1);
  </script>
</body>
</html>
